# Cổng TCP truyền thống cho ESP32 và mosquitto_sub/pub
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Cổng WebSocket cho Web Browser Dashboard
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
